name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Components
        run: |
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace --info

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 7

      - name: Sign Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          SIGNED_FILE="${{ steps.sign_release.outputs.signedReleaseFile }}"
          echo "Signed release file: $SIGNED_FILE"
          if [ -n "$SIGNED_FILE" ] && [ -f "$SIGNED_FILE" ]; then
            cp "$SIGNED_FILE" UFIWebApp-${TAG}.apk
            echo "Copied signed APK -> UFIWebApp-${TAG}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned-signed.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned-signed.apk \
               UFIWebApp-${TAG}.apk
            echo "Copied signed APK (fallback) -> UFIWebApp-${TAG}.apk"
          else
            echo "ERROR: Signed APK not found!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk \
             UFIWebApp-${TAG}-debug.apk
          ls -lh *.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: UFI Web ${{ github.ref_name }}
          body: |
            ## UFI Web ${{ github.ref_name }}

            Android WebView 客户端，访问 UFI-TOOLS 控制台 `http://192.168.43.1:2333`。

            基于 [djsevenx1/claude-code-mobile](https://github.com/djsevenx1/claude-code-mobile) 改造，移除 token 登录，默认预填 UFI-TOOLS 地址。

            ### Downloads
            - **Signed APK**: `UFIWebApp-${{ github.ref_name }}.apk` (官方签名版本)
            - **Debug APK**: `UFIWebApp-${{ github.ref_name }}-debug.apk` (调试用)

            ### 安装
            1. 下载 **Signed APK** 到安卓设备
            2. 设置中开启"安装未知来源应用"
            3. 打开 APK 文件安装
            4. 启动后会自动进入 UFI-TOOLS Web 界面
          files: |
            UFIWebApp-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: UFIWebApp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
